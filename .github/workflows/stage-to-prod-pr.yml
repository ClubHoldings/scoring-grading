name: Open stage to prod PR

# Every push to stage opens or updates a PR into prod. Merge to prod applies to the prod account after the prod environment reviewer approves.
# Merging is a manual click: prod is branch-protected, no auto-merge.

on:
  push:
    branches: [stage]

permissions:
  pull-requests: write
  contents: read

jobs:
  open-or-update-pr:
    name: Open or update stage -> prod PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head stage --base prod --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            echo "PR #$existing already open; this push updated it."
            exit 0
          fi
          commits="$(git log origin/prod..origin/stage --pretty=format:'- %s (%h)')"
          if [[ -z "$commits" ]]; then
            echo "Nothing ahead of prod, no PR needed."
            exit 0
          fi
          gh pr create --head stage --base prod \
            --title "stage -> prod" \
            --body "$(printf '## Commits\n%s\n\nMerge to prod applies to the prod account after the prod environment reviewer approves.' "$commits")"
