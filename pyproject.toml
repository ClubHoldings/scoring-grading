[project]
name = "scoring-grading"
version = "0.1.0"
description = "Property data quality scoring and grading."
requires-python = ">=3.12"
dependencies = ["structlog>=24.1"]

[project.optional-dependencies]
# duckdb: local runs and tests. boto3: Athena executor against the lake.
local = ["duckdb>=1.1"]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "duckdb>=1.1", "boto3>=1.34"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = ["dq", "tests/dq"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["dq"]
